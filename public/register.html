<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Manibhadra Jewellers</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-brand">
        <h1>Manibhadra Jewellers</h1>
        <p>Create a staff account</p>
      </div>

      <form id="registerForm" class="auth-form" novalidate>
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" required placeholder="3–30 characters, letters/numbers/_">
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="new-password" required placeholder="Min 8 chars, mixed case, number, symbol">
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required placeholder="Re-enter password">
        </div>
        <p class="hint auth-hint">Password must include uppercase, lowercase, a number, and a special character.</p>
        <button type="submit" class="btn btn-primary btn-full" id="registerBtn">Create Account</button>
      </form>

      <div id="registerMessage" class="message" hidden></div>

      <p class="auth-footer">
        Already have an account? <a href="login.html">Sign in</a>
      </p>
    </div>
  </div>

  <script src="auth.js"></script>
  <script src="register.js"></script>
  
</body>
</html>
