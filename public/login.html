<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Manibhadra Jewellers</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-brand">
        <h1>Manibhadra Jewellers</h1>
        <p>Sign in to your account</p>
      </div>

      <form id="loginForm" class="auth-form" novalidate>
        <div class="form-group">
          <label for="identifier">Username or Email</label>
          <input type="text" id="identifier" name="identifier" autocomplete="username" required placeholder="Your username or email">
        </div>
        <div class="form-group">
          <label for="password">Password</label>

          <div class="password-wrapper">
            <input
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              required
              placeholder="Your password"
            >

            <button
              type="button"
              class="password-toggle"
              id="passwordToggle"
              aria-label="Show password"
              title="Show password"
            >
              <svg class="eye-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>

              <svg class="eye-off-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2 12s3.5-6 10-6c2.1 0 3.9.6 5.4 1.5"></path>
                <path d="M22 12s-3.5 6-10 6c-2.1 0-3.9-.6-5.4-1.5"></path>
                <path d="M3 3l18 18"></path>
                <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
              </svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="loginBtn">Sign In</button>
      </form>

      <div id="loginMessage" class="message" hidden></div>

      <p class="auth-footer">
        Don't have an account? <a href="register.html">Create one</a>
      </p>
    </div>
  </div>

  <script src="auth.js"></script>
  <script src="login.js"></script>
  
</body>
</html>
