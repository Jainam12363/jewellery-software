<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — Manibhadra Jewellers</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-brand">
        <h1>Manibhadra Jewellers</h1>
        <p>Reset your password</p>
      </div>

      <form id="forgotForm" class="auth-form" novalidate>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" autocomplete="email" required placeholder="Your registered email">
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="forgotBtn">Send Reset Link</button>
      </form>

      <div id="forgotMessage" class="message" hidden></div>

      <p class="auth-footer">
        <a href="login.html">Back to Sign In</a>
      </p>
    </div>
  </div>

  <script src="auth.js"></script>
  <script src="forgot-password.js"></script>
</body>
</html>
